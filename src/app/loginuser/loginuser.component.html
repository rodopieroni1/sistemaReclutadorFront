<div *ngIf="sessionExpired" class="alert alert-warning">
    Tu sesión ha expirado. Por favor, inicia sesión nuevamente.
</div>

<div class="login-wrapper">
    <div class="login-card">
        <div class="avatar">
            <img src="/assets/logo.jpg" alt="Usuario" />
        </div>

        <h2>Inicio de Sesión</h2>

        <form [formGroup]="loginForm" (ngSubmit)="login()">
            <div class="form-group">
                <label for="email">Nombre de Usuario</label>
                <input formControlName="clave" type="email" id="email" (focus)="hideMessage()" autocomplete="off" />
                <div *ngIf="email.invalid && (email.dirty || email.touched)" class="error">
                    <div *ngIf="email.errors?.['required']">Email es obligatorio.</div>
                    <div *ngIf="email.errors?.['minlength']">Debe tener al menos 4 caracteres.</div>
                    <div *ngIf="email.errors?.['forbiddenName']">No puede ser "test".</div>
                </div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input formControlName="password" type="password" id="password" (focus)="hideMessage()"
                    autocomplete="off" />
                <div *ngIf="password.invalid && (password.dirty || password.touched)" class="error">
                    <div *ngIf="password.errors?.['required']">Password es obligatorio.</div>
                    <div *ngIf="password.errors?.['minlength']">Debe tener al menos 4 caracteres.</div>
                </div>
            </div>
            <button type="submit">Ingresar</button>
        </form>

        <div class="links">
            <a routerLink="/registro">¿No tienes cuenta?</a>
            <a routerLink="/olvide-password">Recuperar Contraseña</a>
        </div>

        <p class="error-message" *ngIf="errorMessage">{{ errorMessage }}</p>
    </div>
</div>
