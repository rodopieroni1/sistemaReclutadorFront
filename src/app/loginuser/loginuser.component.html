<div *ngIf="sessionExpired" class="alert alert-warning">
    Tu sesión ha expirado. Por favor, inicia sesión nuevamente.
</div>

<div class="login-wrapper">
    <div class="login-card">
        <div class="avatar">
            <img src="/assets/logo.jpg" alt="Usuario" />
        </div>

        <h2>Inicio de Sesión</h2>

        <form [formGroup]="loginForm" (ngSubmit)="login()">
            <div class="form-group">
                <label for="nombreUsuario">Nombre de Usuario</label>
                <input formControlName="clave" type="text" id="nombreUsuario" (focus)="hideMessage()"
                    autocomplete="off" />
                <div *ngIf="nombreUsuario.invalid && (nombreUsuario.dirty || nombreUsuario.touched)" class="error">
                    <div *ngIf="nombreUsuario.errors?.['required']">Nombre de usuario es obligatorio.</div>
                    <div *ngIf="nombreUsuario.errors?.['minlength']">Debe tener al menos 4 caracteres.</div>
                    <div *ngIf="nombreUsuario.errors?.['forbiddenName']">No puede ser "test".</div>
                </div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input formControlName="password" type="password" id="password" (focus)="hideMessage()"
                    autocomplete="off" />
                <div *ngIf="password.invalid && (password.dirty || password.touched)" class="error">
                    <div *ngIf="password.errors?.['required']">Password es obligatorio.</div>
                    <div *ngIf="password.errors?.['minlength']">Debe tener al menos 4 caracteres.</div>
                </div>
            </div>
            <button type="submit">Ingresar</button>
        </form>

        <div class="links">
            <a routerLink="/registro">¿No tienes cuenta?</a>
            <a (click)="irAOlvidePassword()" class="olvide-link" style="cursor: pointer;">
                ¿Olvidaste tu contraseña?
            </a>
        </div>

        <p class="error-message" *ngIf="errorMessage">{{ errorMessage }}</p>
    </div>
</div>
