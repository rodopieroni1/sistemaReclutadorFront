<section class="banner-empresas">
    <div class="contenido-banner">
        <h1>Empresas</h1>
        <p>
            Descubrí las organizaciones que publican sus búsquedas laborales
            en Carina Di Fonzo.
        </p>
        <mat-form-field appearance="outline" class="buscador">
            <mat-label>Buscar empresa</mat-label>
            <input matInput placeholder="Nombre de la empresa" [formControl]="buscarEmpresa">
            <button mat-icon-button matSuffix>
                <mat-icon>search</mat-icon>
            </button>
        </mat-form-field>
    </div>
</section>
<section class="contenedor-empresas">
    <div class="empresa-card" *ngFor="let empresa of empresasFiltradas">
        <img class="logoEmpresa" [src]="urlApi + '/uploads/empresas/' + empresa.logo" alt="Logo de la empresa">
        <h3>{{empresa.nombre}}</h3>
        <p class="rubro">
            {{empresa.rubro}}
        </p>
        <p class="descripcion">
            {{empresa.descripcion}}
        </p>
        <button mat-raised-button color="primary" (click)="verOfertas(empresa.id)">
            Ver ofertas
        </button>
    </div>
</section>
