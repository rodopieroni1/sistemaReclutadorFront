<app-cabecera></app-cabecera>

<div class="detalle-container" *ngIf="oferta">
    <!-- Header (Ahora solo con los textos del título y empresa) -->
    <div class="detalle-header">
        <div class="empresa-info">
            <div class="textos">
                <h2 class="titulo-oferta">{{ oferta.nombreOferta }}</h2>
                <h3 class="empresa">{{ oferta.empresa.nombre }}</h3>
            </div>
        </div>
    </div>

    <!-- Información principal (Bloque Gris) -->
    <mat-card class="detalle-card">
        <mat-card-content>
            <!-- Botones e Info de Contacto -->
            <div class="card-header-content">
                <div class="botones">
                    <button mat-raised-button style="background-color: #f09b56; color: black;"
                        (click)="aplicar(oferta.idOferta, oferta.nombreOferta)">
                        Aplicar ahora
                    </button>
                    <div class="botones">
                        <button mat-fab class="btn-volver-flotante" routerLink="/home">
                            <mat-icon>arrow_back</mat-icon>
                        </button>
                    </div>
                </div>

                <div class="contacto-info">
                    <p class="contacto"><mat-icon>email</mat-icon> {{ oferta.empresa.email }}</p>
                    <p class="contacto"><mat-icon>phone</mat-icon> {{ oferta.empresa.telefono }}</p>
                    <p class="contacto"><mat-icon>location_on</mat-icon> {{ oferta.empresa.direccion }}</p>
                </div>
            </div>

            <section class="info-seccion">
                <h3>💰 Salario</h3>
                <p>{{ oferta.salario }}</p>
            </section>

            <!-- Sección de Descripción en paralelo con la Foto -->
            <section class="info-seccion-paralelo">
                <div class="descripcion-texto">
                    <h3>📝 Descripción del puesto</h3>
                    <div [innerHTML]="getDescripcionFormateada(oferta.descripcionOferta)"></div>
                </div>

                <div class="foto-contenedor">
                    <img class="logo" [src]="apiUrl + '/uploads/ofertas/' + oferta.fotoOferta"
                        alt="Imagen de la oferta">
                </div>
            </section>

        </mat-card-content>
    </mat-card>
</div>
