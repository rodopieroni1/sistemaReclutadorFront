<div class="auth-container">
    <mat-card>
        <mat-card-header>
            <mat-card-title class="titulo-card">
                Modificar contraseña
            </mat-card-title>
        </mat-card-header>

        <mat-card-content>
            <form #formPassword="ngForm" (ngSubmit)="cambiarPassword()" class="form-password">

                <mat-form-field appearance="outline" class="full-width">
                    <mat-label>Nueva contraseña</mat-label>

                    <input matInput type="password" name="password" [(ngModel)]="password" required minlength="8" />
                </mat-form-field>

                <div class="error-mensaje" *ngIf="passwordInvalida">
                    La contraseña debe tener al menos
                    8 caracteres.
                </div>

                <mat-form-field appearance="outline" class="full-width">
                    <mat-label>Confirmar contraseña</mat-label>

                    <input matInput type="password" name="confirmPassword" [(ngModel)]="confirmPassword" required />
                </mat-form-field>

                <div class="error-mensaje" *ngIf="passwordsNoCoinciden">
                    Las contraseñas no coinciden.
                </div>

                <div class="error-mensaje" *ngIf="errorMensaje">
                    {{ errorMensaje }}
                </div>

                <div class="mensaje-exito" *ngIf="mensajeExito">
                    {{ mensajeExito }}
                </div>

                <button mat-raised-button color="primary" class="btn-password" type="submit" [disabled]="formPassword.invalid
                || passwordInvalida
                || passwordsNoCoinciden
                || cargando">
                    {{ cargando ? 'Guardando...' : 'Cambiar contraseña' }}
                </button>

            </form>

            <div class="volver-login">
                <a href="#" (click)="volverAlLogin($event)">
                    Volver al inicio de sesión
                </a>
            </div>

        </mat-card-content>
    </mat-card>
</div>
