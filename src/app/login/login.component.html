<div class="auth-container">
    <mat-card>
        <mat-card-header>
            <mat-card-title>
                Iniciar Sesión de Administrador
            </mat-card-title>
        </mat-card-header>

        <mat-card-content>
            <form #loginForm="ngForm" (ngSubmit)="login()">
                <mat-form-field appearance="outline" class="full-width">
                    <mat-label>Clave de usuario</mat-label>
                    <input matInput type="text" [(ngModel)]="clave" name="clave" placeholder="Ingrese su clave">
                </mat-form-field>

                <mat-form-field appearance="outline" class="full-width">
                    <mat-label>Contraseña</mat-label>
                    <input matInput type="password" [(ngModel)]="password" name="password"
                        placeholder="Ingrese su contraseña">
                </mat-form-field>

                <button mat-raised-button color="primary" class="btn-login" [disabled]="loginForm.invalid || cargando"
                    (click)="login()">
                    @if (cargando) {
                    <mat-spinner diameter="20" class="spinner"></mat-spinner>
                    } @else {
                    Iniciar Sesión
                    }
                </button>

            </form>
        </mat-card-content>
    </mat-card>
</div>
