<header *ngIf="mostrarCabecera">
    <div class="header-superior">
        <!-- SECCIÓN IZQUIERDA: LOGOTIPOS -->
        <div class="marca">
            <a routerLink="/home" class="logo">
                <img class="logoIcono" src="assets/logopng1.png">
            </a>
            <a routerLink="/home" class="logoLetras">
                <img class="logoTexto" src="assets/logoLetras.png">
            </a>
        </div>

        <!-- SECCIÓN DERECHA: INTERACCIONES -->
        <div class="acciones">
            <!-- 1. Menú de Redes Sociales y Login/Registro -->
            <nav class="social-menu">
                <a href="https://facebook.com" target="_blank" rel="noopener">
                    <img src="../../../assets/facebook-icon.png" alt="Facebook">
                </a>
                <a href="https://instagram.com" target="_blank" rel="noopener">
                    <img src="../../../assets/instagram-icon.png" alt="Instagram">
                </a>
                <a href="https://linkedin.com" target="_blank" rel="noopener">
                    <img src="../../../assets/linkedin-icon.png" alt="LinkedIn">
                </a>

                <ng-container *ngIf="!userLoginOn">
                    <a class="nav-link d-inline" [routerLink]="'/login-user'">Iniciar Sesión</a>
                    <a class="nav-link d-inline" [routerLink]="'/usuariocontrol'">Registrarse</a>
                </ng-container>
            </nav>

            <div class="contenedor-usuario-ancla" style="position: relative;">
                <!-- 🟢 Cambiado: Eliminamos la clase 'dropdown' de este div -->
                <div *ngIf="userLoginOn" class="perfil">
                    <a class="d-flex flex-column align-items-center" href="javascript:void(0)"
                        style="text-decoration: none; color: inherit; cursor: pointer; gap: 4px;"
                        (click)="dropdownAbierto = !dropdownAbierto">
                        <img [src]="userProfileImage" class="perfil-img rounded-circle">
                        <span class="ms-0"
                            style="font-family: 'Comfortaa', sans-serif; font-weight: 700; font-size: 13px;">
                            {{ userName }}
                        </span>
                    </a>

                    <!-- 🟢 CLAVE: Reemplazamos 'dropdown-menu' por 'mi-menu-desplegable' -->
                    <ul class="mi-menu-desplegable" *ngIf="dropdownAbierto">
                        <li class="mi-menu-header text-center">
                            <strong>{{ userName }}</strong>
                        </li>
                        <li>
                            <hr class="dropdown-divider">
                        </li>
                        <!-- 🟢 CLAVE: Reemplazamos 'dropdown-item' por 'mi-item-menu' -->
                        <li><a class="mi-item-menu" (click)="editarPerfil(); dropdownAbierto = false">Editar Perfil</a>
                        </li>
                        <li><a class="mi-item-menu" (click)="misAplicaciones(); dropdownAbierto = false">Mis
                                Aplicaciones</a></li>
                        <li><a class="mi-item-menu text-danger" (click)="logout(); dropdownAbierto = false">Cerrar
                                Sesión</a></li>
                    </ul>
                </div>
            </div>


        </div>
    </div>

    <!-- FILA INFERIOR: MENÚ PRINCIPAL -->
    <nav class="menu-principal">
        <a routerLink="/home">Inicio</a>
        <a (click)="irAOfertas()">Buscar ofertas</a>
        <a routerLink="/empresas">Empresas</a>
        <a (click)="irAContactos()">Contacto</a>
    </nav>
</header>
