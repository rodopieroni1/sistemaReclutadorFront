<body>
    <section class="banner" style="font-family: 'Shippori Mincho', sans-serif;">
        <h1>¡Bienvenido a nuestra plataforma de empleo!</h1>
        <p>Encuentra tus empleos de manera fácil y rápida.</p>
    </section>
    <section class="buscador">
        <form class="d-flex" role="search" onsubmit="searchJobs(event)">
            <input class="form-control me-2" type="search" id="searchInput" placeholder="Buscar empleo"
                aria-label="Search">
            <button class="btn btn-outline-success" type="submit">Buscar</button>
        </form>
    </section>
    <section class="propuestas">
        <h2>Propuestas</h2>
        <div class="card-list">
            <mat-card *ngFor="let oferta of getPaginatedDataOfertas()" class="card">
                <mat-card-header>
                    <mat-card-title>Nº de Oferta: {{ oferta.idOferta }}</mat-card-title>
                    <mat-card-subtitle>Empresa: {{ oferta.id_empresa}}</mat-card-subtitle>
                </mat-card-header>
                <img mat-card-image [src]="'assets/uploads/' + oferta.fotoOferta" alt="Imagen de la oferta">
                <mat-card-content>
                    <p>{{ oferta.descripcionOferta }}</p>
                </mat-card-content>
            </mat-card>
        </div>
    </section>
    <div class="pagination">
        <button (click)="changePage(currentPage - 1)" [disabled]="currentPage === 1">Anterior</button>
        <span>Página {{ currentPage }} de {{ getTotalPages() }}</span>
        <button (click)="changePage(currentPage + 1)" [disabled]="currentPage === getTotalPages()">Siguiente</button>
    </div>
</body>
