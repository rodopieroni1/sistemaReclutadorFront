<body>
    <section class="banner">
        <header class="hero">
            <div class="contenido-hero">
                <h1 class="titulo">Explorá oportunidades de forma rápida y segura</h1>
                <form class="form-busqueda" (submit)="searchJobs($event)">
                    <mat-form-field appearance="outline" class="selector">
                        <mat-label>Buscar por</mat-label>
                        <mat-select [(value)]="criterio">
                            <mat-option value="oferta">Oferta</mat-option>
                            <mat-option value="empresa">Empresa</mat-option>
                            <mat-option value="rubro">Rubro</mat-option>
                        </mat-select>
                    </mat-form-field>
                    <mat-form-field appearance="outline" class="input-expandido">
                        <input matInput [formControl]="ofertaEmpresa" placeholder="Oferta, Empresa o Rubro">
                    </mat-form-field>
                    <button mat-raised-button color="primary" type="submit">
                        <mat-icon>search</mat-icon>
                    </button>
                </form>
            </div>
            <div *ngIf="!userLoginOn">
                <div class="warning-box">
                    <span class="material-icons">warning</span>
                    <div>
                        <strong>Importante</strong><br>
                        Para aplicar en alguna oferta, debes registarte
                    </div>
                </div>
            </div>
        </header>
    </section>

    <section class="propuestas" id="propuestas">
        <h2>Ofertas Activas</h2>
        <div class="card-list">
            <mat-card *ngFor="let oferta of getPaginatedDataOfertas(); trackBy: trackById" class="card">
                <mat-card-header>
                    <mat-card-title>{{ oferta.empresa.nombre }}</mat-card-title>
                    <mat-card-subtitle>
                        <p>{{ oferta.nombreOferta }}</p>
                    </mat-card-subtitle>
                </mat-card-header>
                <mat-card-content>
                    <img mat-card [src]="urlApiTodas + '/uploads/ofertas/' + oferta.fotoOferta"
                        alt="Imagen de la oferta">
                </mat-card-content>
                <mat-card-footer>
                    <div *ngIf="userLoginOn" class="btnAplicar">
                        <button class="btn btn-primary"
                            (click)="aplicar(oferta.idOferta, oferta.nombreOferta)">Aplicar</button>
                        &nbsp;
                        <button mat-raised-button color="accent" (click)="verDetalle(oferta)">Ver más</button>
                    </div>
                </mat-card-footer>
            </mat-card>
        </div>
    </section>

    <div class="pagination">
        <button mat-fab color="primary" (click)="changePage(currentPage - 1)" [disabled]="currentPage === 1">
            <mat-icon>chevron_left</mat-icon>
        </button>
        <span class="page-info">
            &nbsp;&nbsp;{{ currentPage }} &nbsp; / &nbsp;{{ getTotalPages() }} &nbsp;&nbsp;
        </span>
        <button mat-fab color="primary" (click)="changePage(currentPage + 1)"
            [disabled]="currentPage === getTotalPages()">
            <mat-icon>chevron_right</mat-icon>
        </button>
    </div>
</body>
