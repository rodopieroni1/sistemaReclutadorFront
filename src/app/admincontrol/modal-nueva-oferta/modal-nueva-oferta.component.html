<div class="modal-header">
    <h2 *ngIf="accion === 'crear'">Agregar Oferta</h2>
    <h2 *ngIf="accion === 'actualizar'">Modificar Oferta</h2>
</div>
<mat-dialog-content>
    <form [formGroup]="miFormulario" (ngSubmit)="guardar()" id="formOferta" class="form-oferta mejorado">
        <section class="form-section">
            <mat-form-field appearance="fill" class="inputModal full-width">
                <mat-label>Título de la Oferta</mat-label>
                <input matInput placeholder="Ingrese un título para la oferta" formControlName="nombreOferta" required>
                <mat-error
                    *ngIf="miFormulario.get('nombreOferta')?.invalid && miFormulario.get('nombreOferta')?.touched">
                    El título es obligatorio.
                </mat-error>
            </mat-form-field>
            <!-- Descripción amplia -->
            <mat-form-field appearance="fill" class="inputModal full-width grande">
                <mat-label>Descripción de la Oferta</mat-label>
                <textarea matInput placeholder="Ingrese la descripción completa aquí..."
                    formControlName="descripcionOferta" rows="12" required></textarea>
                <mat-hint align="start">Puedes usar viñetas con "-" para listar puntos</mat-hint>
                <mat-error
                    *ngIf="miFormulario.get('descripcionOferta')?.invalid && miFormulario.get('descripcionOferta')?.touched">
                    La descripción es obligatoria.
                </mat-error>
            </mat-form-field>
        </section>
        <section class="form-section doble-columna">
            <!-- Estado -->
            <mat-form-field appearance="fill">
                <mat-label>Estado de la Oferta</mat-label>
                <mat-select formControlName="estadoOferta">
                    <mat-option [value]="true">✅ Activa</mat-option>
                    <mat-option [value]="false">❌ Inactiva</mat-option>
                </mat-select>
            </mat-form-field>
            <!-- Empresa -->
            <mat-form-field appearance="fill">
                <mat-label>Empresa</mat-label>
                <mat-select formControlName="idEmpresa">
                    <mat-option *ngFor="let empresa of empresas" [value]="empresa.id_empresa">
                        {{ empresa.nombre }}
                    </mat-option>
                </mat-select>
            </mat-form-field>
        </section>
        <section class="form-section">
            <div class="file-upload-container">
                <input type="file" #inputFile accept="image/*" (change)="onArchivoSeleccionado($event)" hidden>
                <button mat-raised-button color="primary" type="button" (click)="inputFile.click()">
                    Seleccionar / Subir Imagen
                </button>
                <div class="preview-container">
                    <img *ngIf="imagenPreview" [src]="imagenPreview" alt="Previsualización" class="preview-img" />
                    <img *ngIf="!imagenPreview && imagenDesdeBD" [src]="uploadUrl + '/uploads/logos/' + imagenDesdeBD"
                        alt="Imagen actual" class="preview-img" />
                </div>
            </div>
        </section>
    </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
    <button type="button" mat-button (click)="cerrar()">Cancelar / Cerrar</button>
    <button type="submit" mat-raised-button color="primary" form="formOferta">Guardar</button>
</mat-dialog-actions>
